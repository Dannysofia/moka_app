<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/consejos" text="Volver a Consejos" color="success"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle del consejo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="consejo as c">
  <div class="header">
    <div class="hero" [class.placeholder]="!c.imagen_url" [style.backgroundImage]="c.imagen_url ? 'url(' + c.imagen_url + ')' : ''" role="img" [attr.aria-label]="c.titulo"></div>
    <h1>{{ c.titulo }}</h1>
    <div class="meta">
      <span *ngIf="c.categoria" class="chip">{{ c.categoria }}</span>
      <span *ngIf="fechaPublicacion" class="date">Publicado: {{ fechaPublicacion }}</span>
      <span *ngIf="fuenteLabel" class="source">Fuente: {{ fuenteLabel }}</span>
    </div>
  </div>

  <div class="content">
    <p>{{ c.contenido }}</p>
  </div>

  <ion-toast [isOpen]="showToast" [message]="toastMsg" [color]="toastColor" duration="2000" (didDismiss)="showToast = false"></ion-toast>
</ion-content>

<ion-content *ngIf="!consejo && !loading">
  <div class="empty">No fue posible cargar el consejo seleccionado</div>
  <ion-toast [isOpen]="showToast" [message]="toastMsg" [color]="toastColor" duration="2000" (didDismiss)="showToast = false"></ion-toast>
</ion-content>
