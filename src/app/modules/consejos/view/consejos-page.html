<ion-header>
  <ion-toolbar>
    <ion-title>Consejos</ion-title>
    <ion-buttons slot="end">
      <ion-menu-button autoHide="false" menu="main-menu" aria-label="Abrir menu">
        <ion-icon slot="icon-only" name="menu-outline"></ion-icon>
      </ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-searchbar
    placeholder="Buscar consejos"
    [(ngModel)]="searchTerm"
    showClearButton="focus"
    debounce="200">
  </ion-searchbar>

  <div class="grid" *ngIf="filtered && filtered.length; else vacio">
    <div class="card" *ngFor="let c of filtered; trackBy: trackById" (click)="verDetalle(c.id)">
      <div class="thumb" [class.placeholder]="!c.imagen_url" [style.backgroundImage]="c.imagen_url ? 'url(' + c.imagen_url + ')' : ''" role="img" [attr.aria-label]="c.titulo"></div>
      <div class="overlay">
        <div class="text">
          <div class="title">{{ c.titulo }}</div>
          <div class="subtitle" *ngIf="c.contenido as texto">{{ texto }}</div>
        </div>
        <ion-icon name="chevron-forward-outline" class="chev"></ion-icon>
      </div>
    </div>
  </div>

  <ng-template #vacio>
    <div class="empty">Aún no hay consejos disponibles</div>
  </ng-template>

  <ion-toast [isOpen]="showToast" [message]="toastMsg" [color]="toastColor" duration="2200" (didDismiss)="showToast = false"></ion-toast>
</ion-content>
